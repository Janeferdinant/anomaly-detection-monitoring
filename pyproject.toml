[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-monitoring"
version = "0.2.0"
description = "Anomaly detection for data quality and monitoring: detectors, rule layer, matched-recall evaluation, streaming."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "statsmodels>=0.14",
]

[project.scripts]
monitor = "anomaly_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anomaly_monitoring = ["smd_manifest.json", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["src/anomaly_monitoring"]

[tool.ruff.lint.isort]
known-first-party = ["anomaly_monitoring", "scripts", "conftest"]
